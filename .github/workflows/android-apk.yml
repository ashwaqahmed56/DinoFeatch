name: Build & Release DinoFetch Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Single-File EXE
        run: |
          python -m PyInstaller DinoFetch.spec --noconfirm --clean

      - name: Publish EXE to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v2.0 2>$null || gh release create v2.0 --title "DinoFetch v2.0" --notes "Latest release build."
          gh release upload v2.0 dist/DinoFetch.exe --clobber
