name: DinoFetch APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "app.py"
      - "media_downloader.py"
      - "templates/**"
      - "static/**"

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Cache Buildozer & Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade "Cython<3.0" buildozer

      - name: Stage app files into android/
        run: |
          cp app.py media_downloader.py android/
          cp -r templates static android/
          ls -la android/

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Verify APK generated
        run: |
          echo "Listing android/bin contents:"
          ls -lh android/bin/
          if ! ls android/bin/*.apk 1> /dev/null 2>&1; then
            echo "ERROR: No APK found in android/bin/! Buildozer failed to create APK."
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-build-log
          path: android/build.log
          if-no-files-found: ignore

      - name: Publish APK to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd android/bin
          # Create the release tag if it does not already exist
          gh release view v2.0 >/dev/null 2>&1 || \
            gh release create v2.0 \
              --title "DinoFetch v2.0 APK" \
              --notes "Latest automatic build from commit ${{ github.sha }}."
          # Upload or replace the APK asset
          gh release upload v2.0 *.apk --clobber

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DinoFetch-debug-apk
          path: android/bin/*.apk
          if-no-files-found: error
