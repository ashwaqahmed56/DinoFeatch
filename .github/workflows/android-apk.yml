name: DinoFetch APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "app.py"
      - "media_downloader.py"
      - "templates/**"
      - "static/**"

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip wheel
          pip install buildozer

      - name: Stage app files into android/
        run: |
          cp app.py media_downloader.py android/
          cp -r templates static android/
          ls -la android/

      - name: Download Android SDK/NDK
        working-directory: android
        run: yes | buildozer -v android sdk

      - name: Build debug APK
        working-directory: android
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DinoFetch-debug-apk
          path: android/bin/*.apk
          if-no-files-found: error
